name: "Build"
on: ["push", "pull_request", "workflow_dispatch"]

permissions:
  contents: "read"

jobs:
  build:
    runs-on: "ubuntu-24.04"
    if: "${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10" # v6.0.3
        with:
          persist-credentials: false
      # 与已验收工作区的 gitlink 一致，使用公开源码中的定制 API。
      # 27c6769 起 AnimationControllerInstance 才有 controllerDefinitions 五参构造器，
      # 更早的 1309712f 只有四参，编不过 ServerEntityTicker:137。
      - name: "Checkout BedrockMotion"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: EaseCation/BedrockMotion
          ref: 27c6769d78cf938b97d9101623352122af4dc171
          path: .ci-dependencies/BedrockMotion
          persist-credentials: false
      # BedrockMotion 27c6769 调 BedrockDataParser.parseAttachable(String, String)，
      # 该重载从 faf2e01 起才有，旧 pin 80826eb9 只有单参版本。
      - name: "Checkout CubeConverter"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: EaseCation/CubeConverter
          ref: faf2e013dcca3272e6e4260a139f45093ac8603a
          path: .ci-dependencies/CubeConverter
          persist-credentials: false
      - name: "Checkout ViaVersion 5.9.2"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: EaseCation/ViaVersion
          ref: eafcdf9c971f78e1b0a6408223a3a9b6db0c9d4a
          path: .ci-dependencies/ViaVersion
          persist-credentials: false
      - name: "Checkout ViaVersion 5.12.0"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: ViaVersion/ViaVersion
          ref: e8bbb5da5b7f9acae31a76f4d254ef24e1819719
          path: .ci-dependencies/ViaVersion-5.12
          persist-credentials: false
      # BedrockMotion 27c6769 依赖 team.unnamed:mocha:3.0.3-ec.4（EaseCation 的 fork），
      # 该坐标不在公开仓库里，得自己发进 mavenLocal。源码取组织内镜像仓，
      # 与上游 a0690f3 同树，不随上游仓库的可见性变化而断。
      - name: "Checkout mocha 3.0.3-ec.4"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: GanquanOnline/mocha
          ref: a0690f333d1089646c98c77e5118ecb926c3e12e
          path: .ci-dependencies/mocha
          persist-credentials: false
      - name: "Set up Gradle"
        uses: "gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e" # v6.1.0
        with:
          cache-disabled: true
      - name: "Set up Java 25"
        uses: "actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654" # v5.2.0
        with:
          distribution: "temurin"
          java-version: 25
          check-latest: true
      - name: "Drop shadowed-variant requirement"
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path
          pattern = re.compile(r"\{\s*attributes\s*\{[^}]*SHADOWED[^}]*\}\s*\}", re.S)
          for relative in (".ci-dependencies/CubeConverter/build.gradle", ".ci-dependencies/BedrockMotion/build.gradle"):
              path = Path(relative)
              text = pattern.sub("", path.read_text())
              text = text.replace("repositories {", "repositories {\n    mavenLocal()", 1)
              path.write_text(text)
          PY
      # fork 原本要 JDK 17 且强制 GPG 签名；CI 只有 21、也没有 signatory。
      # source/target 仍是 Java 8，产出的字节码不变。
      - name: "Patch mocha build for the CI JDK"
        run: |
          python3 - << 'PY'
          from pathlib import Path
          path = Path(".ci-dependencies/mocha/build.gradle.kts")
          text = path.read_text()
          replacements = [
              ("JavaLanguageVersion.of(17)", "JavaLanguageVersion.of(21)"),
              (
                  'signing {\n    sign(publishing.publications["maven"])\n}',
                  'if (project.hasProperty("sign")) {\n    signing {\n        sign(publishing.publications["maven"])\n    }\n}',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit("mocha patch target not found: %s" % old[:40])
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: "Publish shaded ViaVersion 5.9.2"
        working-directory: .ci-dependencies/ViaVersion
        run: "./gradlew :viaversion-common:publishToMavenLocal --no-daemon"
      - name: "Apply Ganquan ViaVersion shims"
        working-directory: .ci-dependencies/ViaVersion-5.12
        run: "git apply --whitespace=nowarn \"$GITHUB_WORKSPACE/.github/ci/viaversion-5.12.0-ganquan.patch\""
      - name: "Publish shaded ViaVersion 5.12.0"
        working-directory: .ci-dependencies/ViaVersion-5.12
        run: "./gradlew :viaversion-common:publishToMavenLocal --no-daemon"
      # mocha 的 Gradle 8.8 不能启动在 Java 25 上，单独切一次 21，发完再切回 25。
      - name: "Set up Java 21 for mocha"
        uses: "actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654" # v5.2.0
        with:
          distribution: "temurin"
          java-version: 21
      - name: "Publish mocha to mavenLocal"
        working-directory: .ci-dependencies/mocha
        run: "./gradlew publishToMavenLocal -x test --no-daemon --stacktrace"
      - name: "Restore Java 25"
        uses: "actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654" # v5.2.0
        with:
          distribution: "temurin"
          java-version: 25
          check-latest: true
      - name: "Build with Gradle"
        run: "./gradlew --project-dir .github/ci :ViaBedrock:assemble :ViaBedrock:test --tests net.raphimc.viabedrock.experimental.storage.RidingTrackerTest --tests net.raphimc.viabedrock.experimental.storage.RidingTrackerMotTest --tests net.raphimc.viabedrock.protocol.storage.PacketSyncStorageTest --tests net.raphimc.viabedrock.protocol.rewriter.neighbor.PlantConnectionRulesTest --tests net.raphimc.viabedrock.experimental.rewriter.CreeperIgnitionMetadataTest --stacktrace"
      - name: "Upload artifacts to GitHub"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "Artifacts"
          path: "build/libs/"
          if-no-files-found: "error"
