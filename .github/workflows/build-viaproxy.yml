name: "Build ViaProxy"

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:
    inputs:
      viaproxy_ref:
        description: "ViaProxy_NetEase branch, tag, or SHA"
        required: false
        default: "main"
      publish_release:
        description: "Publish a new versioned GitHub Release (bumps the version and creates a new tag)"
        type: boolean
        default: true

permissions:
  contents: "read"

concurrency:
  group: "build-viaproxy-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build-viaproxy:
    runs-on: "ubuntu-24.04"
    permissions:
      contents: "write"
    steps:
      - name: "Checkout ViaBedrock_NetEase"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          persist-credentials: false
          # 发布说明需要跨版本标签的完整历史与 tag。
          fetch-depth: 0
      - name: "Checkout ViaProxy_NetEase"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: "${{ github.repository_owner }}/ViaProxy_NetEase"
          ref: "${{ github.event_name == 'workflow_dispatch' && inputs.viaproxy_ref || 'main' }}"
          path: "viaproxy"
          persist-credentials: false
          token: "${{ secrets.ORG_READ_TOKEN || github.token }}"
      - name: "Set up Gradle"
        uses: "gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e" # v6.1.0
        with:
          cache-disabled: true
      - name: "Set up Java 25"
        uses: "actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654" # v5.2.0
        with:
          distribution: "temurin"
          java-version: 25
          check-latest: true
      # 与 build.yml 相同的提交。根工程 publishToMavenLocal 不会走 .github/ci 的 includeBuild，
      # 所以 BedrockMotion / CubeConverter 也要先进入 mavenLocal，ViaProxy 才能解析传递依赖。
      - name: "Checkout BedrockMotion"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: EaseCation/BedrockMotion
          ref: 27c6769d78cf938b97d9101623352122af4dc171
          path: .ci-dependencies/BedrockMotion
          persist-credentials: false
      - name: "Checkout CubeConverter"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: EaseCation/CubeConverter
          ref: 80826eb92ccd5e75c1013e287c7308ac7e5d2471
          path: .ci-dependencies/CubeConverter
          persist-credentials: false
      - name: "Checkout ViaVersion 5.9.2"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: EaseCation/ViaVersion
          ref: eafcdf9c971f78e1b0a6408223a3a9b6db0c9d4a
          path: .ci-dependencies/ViaVersion
          persist-credentials: false
      - name: "Checkout ViaVersion 5.12.0"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: ViaVersion/ViaVersion
          ref: e8bbb5da5b7f9acae31a76f4d254ef24e1819719
          path: .ci-dependencies/ViaVersion-5.12
          persist-credentials: false
      - name: "Drop shadowed-variant requirement"
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path
          pattern = re.compile(r"\{\s*attributes\s*\{[^}]*SHADOWED[^}]*\}\s*\}", re.S)
          for relative in (".ci-dependencies/CubeConverter/build.gradle", ".ci-dependencies/BedrockMotion/build.gradle"):
              path = Path(relative)
              text = pattern.sub("", path.read_text())
              text = text.replace("repositories {", "repositories {\n    mavenLocal()", 1)
              path.write_text(text)
          PY
      - name: "Publish shaded ViaVersion 5.9.2"
        working-directory: .ci-dependencies/ViaVersion
        run: "./gradlew :viaversion-common:publishToMavenLocal --no-daemon"
      - name: "Apply Ganquan ViaVersion shims"
        working-directory: .ci-dependencies/ViaVersion-5.12
        run: "git apply --whitespace=nowarn \"$GITHUB_WORKSPACE/.github/ci/viaversion-5.12.0-ganquan.patch\""
      - name: "Publish shaded ViaVersion 5.12.0"
        working-directory: .ci-dependencies/ViaVersion-5.12
        run: "./gradlew :viaversion-common:publishToMavenLocal --no-daemon"
      # CubeConverter 是 Gradle 8.13，BedrockMotion 是 Gradle 8.8。两者都不能在 Java 25 上启动。
      - name: "Set up Java 21"
        uses: "actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654" # v5.2.0
        with:
          distribution: "temurin"
          java-version: 21
      - name: "Publish CubeConverter to mavenLocal"
        working-directory: .ci-dependencies/CubeConverter
        run: "./gradlew publishToMavenLocal -x test --no-daemon --stacktrace"
      - name: "Publish BedrockMotion to mavenLocal"
        working-directory: .ci-dependencies/BedrockMotion
        run: "./gradlew publishToMavenLocal -x test --no-daemon --stacktrace"
      - name: "Set up Java 25"
        uses: "actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654" # v5.2.0
        with:
          distribution: "temurin"
          java-version: 25
          check-latest: true
      - name: "Publish this ViaBedrock to mavenLocal"
        id: "versions"
        run: |
          set -euo pipefail
          base="$(awk -F= '/^maven_version=/{print $2}' gradle.properties | tr -d '\r')"
          base="${base%-SNAPSHOT}"
          version="${base}-ci.${GITHUB_SHA::7}"
          echo "viabedrock_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Publishing net.raphimc:ViaBedrock:${version} to mavenLocal"
          ./gradlew publishToMavenLocal -Pmaven_version="${version}" -x test --stacktrace
      # 每次发布递增序号：取已有 v<base>-viabedrock.<n> 标签的最大 n 加一。
      # 不再复用固定标签 viaproxy-latest，每个版本都有自己的 tag。
      - name: "Compute next release version"
        id: "release"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          vp_base="$(awk -F= '/^maven_version=/{print $2}' viaproxy/gradle.properties | tr -d '\r')"
          vp_base="${vp_base%-SNAPSHOT}"
          vp_esc="${vp_base//./\\.}"
          tags="$(gh release list --limit 500 --json tagName --jq '.[].tagName' || true)"
          max_n="$(printf '%s\n' "${tags}" | sed -n "s/^v${vp_esc}-viabedrock\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n 1)"
          next="$(( ${max_n:-0} + 1 ))"
          version="${vp_base}-viabedrock.${next}"
          {
            echo "version=${version}"
            echo "tag=v${version}"
            if [ -n "${max_n}" ]; then echo "previous_tag=v${vp_base}-viabedrock.${max_n}"; fi
          } >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version}"
      - name: "Point ViaProxy at the CI ViaBedrock"
        id: "viaproxy-version"
        working-directory: "viaproxy"
        env:
          VIABEDROCK_VERSION: "${{ steps.versions.outputs.viabedrock_version }}"
          VIAPROXY_VERSION: "${{ steps.release.outputs.version }}"
        run: |
          set -euo pipefail
          if ! grep -q 'net.raphimc:ViaBedrock:' build.gradle; then
            echo "ViaProxy build.gradle no longer depends on net.raphimc:ViaBedrock" >&2
            exit 1
          fi
          perl -i -pe 's/net\.raphimc:ViaBedrock:[^"]+/net.raphimc:ViaBedrock:$ENV{VIABEDROCK_VERSION}/' build.gradle
          grep -n 'net.raphimc:ViaBedrock:' build.gradle
          echo "viaproxy_version=${VIAPROXY_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: "Build ViaProxy with this ViaBedrock packed in"
        working-directory: "viaproxy"
        run: "./gradlew jar downgradeJar -Pmaven_version=${{ steps.viaproxy-version.outputs.viaproxy_version }} --stacktrace"
      - name: "Stage release jars"
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          copied=0
          for f in build/libs/ViaBedrock-*.jar; do
            case "$f" in
              *-sources.jar|*-javadoc.jar) continue ;;
            esac
            cp -v "$f" dist/
            copied=$((copied + 1))
          done
          for f in viaproxy/build/libs/ViaProxy-*.jar; do
            cp -v "$f" dist/
            copied=$((copied + 1))
          done
          if [ "$copied" -eq 0 ]; then
            echo "Missing ViaBedrock or ViaProxy jars" >&2
            ls -la build/libs viaproxy/build/libs >&2 || true
            exit 1
          fi
          ls -lah dist
      - name: "Upload artifacts to GitHub"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "ViaProxy"
          path: "dist/"
          if-no-files-found: "error"
      - name: "Publish versioned GitHub Release"
        if: "${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}"
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ steps.release.outputs.tag }}"
          RELEASE_VERSION: "${{ steps.release.outputs.version }}"
          PREVIOUS_TAG: "${{ steps.release.outputs.previous_tag }}"
        run: |
          set -euo pipefail
          if [ -n "${PREVIOUS_TAG}" ] && git rev-parse -q --verify "refs/tags/${PREVIOUS_TAG}" >/dev/null; then
            range="${PREVIOUS_TAG}..${GITHUB_SHA}"
            limit=200
            scope="自 ${PREVIOUS_TAG} 起的全部提交"
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${GITHUB_SHA}"
          else
            range="${GITHUB_SHA}"
            limit=30
            scope="首个独立版本，列出最近 30 个提交"
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          fi
          commits="$(git --no-pager log --format='- %h %s' --max-count=${limit} "${range}")"
          # 把上游 merge 展开成它真正带进来的那些提交，否则发布说明只剩一行 merge 标题。
          upstream=""
          for merge in $(git --no-pager log --format='%h' --merges --max-count=${limit} "${range}" || true); do
            subject="$(git --no-pager log -1 --format='%s' "${merge}")"
            if printf '%s' "${subject}" | grep -qi 'upstream'; then
              part="$(git --no-pager log --format='- %h %s' --max-count=60 "${merge}^1..${merge}^2" 2>/dev/null || true)"
              upstream="${upstream}${part}"$'\n'
            fi
          done
          upstream="$(printf '%s' "${upstream}" | sed '/^$/d')"
          fixes="$(printf '%s\n' "${commits}" | grep -Ei '^- [0-9a-f]+ (fix|hotfix|修复)' || true)"
          features="$(printf '%s\n' "${commits}" | grep -Ei '^- [0-9a-f]+ (feat|新增|add|支持)' || true)"
          others="$(printf '%s\n' "${commits}" | grep -Eiv '^- [0-9a-f]+ (merge.*upstream|fix|hotfix|修复|feat|新增|add|支持)' || true)"
          {
            echo "ViaProxy_NetEase ${RELEASE_VERSION}"
            echo
            echo "本仓库的 ViaBedrock 打进 ViaProxy 后的可运行发行包。"
            echo
            echo "### 合并的上游改动"
            echo
            if [ -n "${upstream}" ]; then printf '%s\n' "${upstream}"; else echo "（无）"; fi
            echo
            echo "### 修复"
            echo
            if [ -n "${fixes}" ]; then printf '%s\n' "${fixes}"; else echo "（无）"; fi
            echo
            echo "### 新增"
            echo
            if [ -n "${features}" ]; then printf '%s\n' "${features}"; else echo "（无）"; fi
            echo
            echo "### 其他变更"
            echo
            if [ -n "${others}" ]; then printf '%s\n' "${others}"; else echo "（无）"; fi
            echo
            echo "### 构建信息"
            echo
            echo "- ViaBedrock 提交：${GITHUB_SHA}"
            echo "- ViaBedrock 坐标：net.raphimc:ViaBedrock:${{ steps.versions.outputs.viabedrock_version }}"
            echo "- ViaProxy_NetEase 引用：${{ github.event_name == 'workflow_dispatch' && inputs.viaproxy_ref || 'main' }}"
            echo "- ViaProxy 版本：${{ steps.viaproxy-version.outputs.viaproxy_version }}"
            echo "- 变更范围：${scope}"
            echo "- 完整对比：${compare}"
            echo "- 工作流运行：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "私有兄弟仓库检出可配置 secret ORG_READ_TOKEN（contents:read）。"
          } > notes.md
          gh release create "${RELEASE_TAG}" dist/* --prerelease \
            --title "ViaProxy_NetEase ${RELEASE_VERSION}" --notes-file notes.md
