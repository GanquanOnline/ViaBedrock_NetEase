rootProject.name = 'ViaBedrockCI'

includeBuild('../..')
includeBuild('../../.ci-dependencies/BedrockMotion') {
    dependencySubstitution {
        substitute module('com.github.EaseCation:BedrockMotion') using project(':')
    }
}
includeBuild('../../.ci-dependencies/CubeConverter') {
    dependencySubstitution {
        substitute module('com.github.EaseCation:CubeConverter') using project(':')
        substitute module('org.oryxel.cube:cubeconverter') using project(':')
        substitute module('com.github.oryxel1:CubeConverter') using project(':')
    }
}

// Only BedrockMotion's 5.9.2 request is substituted. ViaBedrock's 5.12.0-SNAPSHOT
// comes from the shaded jar published to mavenLocal; substituting that module would
// expose the unshaded classes directory and drop relocated fastutil/gson.
includeBuild('../../.ci-dependencies/ViaVersion') {
    dependencySubstitution {
        substitute module('com.viaversion:viaversion-common:5.9.2-SNAPSHOT') using project(':viaversion-common')
    }
}
