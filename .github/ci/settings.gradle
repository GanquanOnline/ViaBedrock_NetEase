rootProject.name = 'ViaBedrockCI'

includeBuild('../..')
includeBuild('../../.ci-dependencies/BedrockMotion') {
    dependencySubstitution {
        substitute module('com.github.EaseCation:BedrockMotion') using project(':')
    }
}
includeBuild('../../.ci-dependencies/CubeConverter') {
