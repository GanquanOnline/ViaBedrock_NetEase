plugins {
    id "java-library"
    id "base.base-conventions"
    id "base.fill-build-constants"
    id "viabedrock.publishing-conventions"
    id "via.run-with-viaproxy-task"
    id "net.raphimc.class-token-replacer" version "1.1.7"
}

sourceSets {
    tool

    tool.compileClasspath += main.output + main.compileClasspath
    tool.runtimeClasspath += tool.compileClasspath
}

tasks.register("generateJavaSoundCatalog", JavaExec) {
    group = "data generation"
    description = "Generates compact Java sounds.json acoustic catalogs"
    classpath = sourceSets.tool.runtimeClasspath
    mainClass = "net.raphimc.viabedrock.tool.generator.JavaSoundCatalogGenerator"
    args "1.21.8", "1.21.10", "1.21.11", "26.1"
    workingDir project.projectDir
}

repositories {
    mavenLocal()
    maven {
        name = "ViaVersion"
        url = "https://repo.viaversion.com"

        content {
            includeGroupByRegex "com\\.viaversion(\\..+)?"
            includeGroupByRegex "net\\.raphimc(\\..+)?"
        }
    }
    maven {
        name = "Minecraft Libraries"
        url = "https://libraries.minecraft.net"

        content {
            includeGroup "com.mojang"
        }
    }
    maven {
        name = "Jitpack"
        url = "https://jitpack.io"

        content {
            includeGroupByRegex "com\\.github\\..+"
        }
    }
}

dependencies {
    compileOnly "com.viaversion:viaversion-common:5.12.0-SNAPSHOT"
    compileOnly "org.yaml:snakeyaml:2.6"
    compileOnly "com.google.guava:guava:33.6.0-jre"
    compileOnly "org.checkerframework:checker-qual:3.54.0"
    compileOnly "io.netty:netty-handler:4.2.14.Final"
    compileOnly "com.google.code.gson:gson:2.14.0"
    compileOnly "dev.kastle.netty:netty-transport-raknet:1.7.0"
    implementation "org.msgpack:msgpack-core:0.9.8"

    testImplementation "com.viaversion:viaversion-common:5.12.0-SNAPSHOT"
    testImplementation "com.google.guava:guava:33.6.0-jre"
    testImplementation "org.junit.jupiter:junit-jupiter-api:6.0.3"
    testImplementation "org.openjdk.jol:jol-core:0.17"
    testImplementation "io.netty:netty-buffer:4.2.14.Final"
    testImplementation "io.netty:netty-handler:4.2.14.Final"
    testImplementation "io.netty:netty-transport:4.2.14.Final"
    testImplementation "com.google.code.gson:gson:2.14.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.0.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.0.3"
    testRuntimeOnly "com.google.code.gson:gson:2.14.0"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.16"

    api("io.netty:netty-codec-http:4.2.14.Final") {
        transitive = false
    }
    api("io.netty:netty-codec-compression:4.2.14.Final") {
        transitive = false
    }
    api "io.jsonwebtoken:jjwt-impl:0.13.0"
    api("io.jsonwebtoken:jjwt-gson:0.13.0") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    api("net.lenni0451.mcstructs-bedrock:text:2.0.1") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    api("net.lenni0451.mcstructs-bedrock:forms:2.0.1") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    api("com.viaversion.mcstructs:dialog:5-3.2.2-20251210.004302-1") {
        exclude group: "com.viaversion.mcstructs", module: "core"
        exclude group: "com.viaversion.mcstructs", module: "text"
        exclude group: "com.viaversion.mcstructs", module: "snbt"
        exclude group: "com.viaversion.mcstructs", module: "converter"
    }
    api "com.vdurmont:semver4j:3.1.0"
    api "com.mojang:brigadier:1.3.10"
    api "at.yawk.lz4:lz4-java:1.11.0"
    api("com.github.EaseCation:CubeConverter:1.3") {
        transitive = false
    }
    api("team.unnamed:mocha:3.0.1") {
        transitive = false
    }
    api("com.github.EaseCation:BedrockMotion:1.0.0") {
        exclude group: 'com.github.EaseCation', module: 'CubeConverter'
        exclude group: 'team.unnamed', module: 'mocha'
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    toolImplementation "org.jsoup:jsoup:1.22.2"
    toolImplementation "org.ow2.asm:asm-tree:9.10"
    toolImplementation "net.lenni0451.commons:asm:1.9.2"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named("test", Test) {
    useJUnitPlatform {
        excludeTags "performance"
    }
}

tasks.register("jfrAllocationTest", Test) {
    group = "verification"
    description = "Runs the opt-in JFR allocation regression gate"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    environment "VIABEDROCK_JFR_ALLOCATIONS", "true"
    useJUnitPlatform {
        includeTags "performance"
    }
    filter {
        includeTestsMatching "net.raphimc.viabedrock.protocol.rewriter.HotPathAllocationJfrTest"
    }
}

tasks.register("resourcePackGcSoakTest", Test) {
    group = "verification"
    description = "Runs the opt-in 20-session resource-pack GC soak"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxHeapSize = "512m"
    jvmArgs "-XX:+UseG1GC"
    environment "VIABEDROCK_GC_SOAK", "true"
    useJUnitPlatform {
        includeTags "performance"
    }
    filter {
        includeTestsMatching "net.raphimc.viabedrock.protocol.storage.ResourcePackGcSoakTest"
    }
}

tasks.register("resourcePackRetainedHeapTest", Test) {
    group = "verification"
    description = "Measures retained heap for 1, 10, and 20 shared resource-pack sessions"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    environment "VIABEDROCK_RETAINED_HEAP", "true"
    jvmArgs "-Djol.magicFieldOffset=true"
    useJUnitPlatform {
        includeTags "performance"
    }
    filter {
        includeTestsMatching "net.raphimc.viabedrock.protocol.storage.ResourcePackRetainedHeapTest"
    }
}
