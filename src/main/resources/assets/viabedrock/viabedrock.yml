# If true, enables experimental features. These features are almost certainly not fully stable/tested and may cause unexpected issues
enable-experimental-features: false
# If true, Java Edition swords play the legacy blocking animation while right-click is held.
# Normal sword right-click interactions are still forwarded to the Bedrock server.
# ViaBedrock does not grant damage reduction; only the animation-only release packet is suppressed.
# Java 1.21.8 still applies its normal held-use movement slowdown while the animation is active.
# Requires enable-experimental-features: true.
enable-sword-blocking-animation: false
# Bridge arbitrary Java custom payloads and bounded Bedrock ScriptMessages in both directions.
java-custom-payload-bridge:
  enabled: false
  max-payload-bytes: 8192
  max-channel-bytes: 128
  max-messages-per-minute: 120
  max-bytes-per-minute: 262144
# Controls blob caching (Reduces network usage and loading time), Valid options: "disabled", "memory", "disk"
blob-cache: "disk"
# If enabled, starts the resource pack HTTP server and enables resource pack translation
translate-resource-packs: true
# Resource pack HTTP server address
resource-pack-host: 127.0.0.1
# Resource pack HTTP server port (0 = random available port)
resource-pack-port: 0
# Resource pack URL which the clients will use to download the resource pack (empty = auto)
resource-pack-url: ""
# Resource pack delivery mode. "embedded" serves packs from this ViaProxy process;
# "remote" uploads converted packs to the shared pack service.
resource-pack-delivery:
  mode: embedded
  internal-url: ""
  public-url: ""
  shared-secret: ""
  connect-timeout-millis: 2000
  request-timeout-millis: 10000
# Controls resource pack caching (Reduces network usage and loading time), Valid options: "disabled", "memory", "disk"
pack-cache: "disk"

# Process-wide content-addressed resource-pack cache. Set enabled to false to use the legacy per-connection path.
# The mode is fixed at process startup; changing enabled requires a full ViaBedrock restart.
resource-pack-cache:
  enabled: true
  # If true, a previously verified CDN pack may be reused only when backend address, UUID, raw version,
  # announced size, content id, content-key fingerprint, and the full ordered RESOURCE_PACKS_INFO
  # announcement are identical. Conflicting content always forces acquisition. UUID/version alone is never trusted.
  trust-declared-pack-alias: false
  # 0 = auto (min(3072 MiB, max(512 MiB, one quarter of max heap))).
  memory-budget-mib: 0
  # 0 = auto (min(one half of max heap, twice memory-budget-mib)).
  memory-hard-limit-mib: 0
  # 0 = auto (half the available processors, clamped to 2..4); configured values are clamped to 1..64.
  cpu-workers: 0
  # Clamped to 1..64.
  io-workers: 4
  # Per executor and for all pending resource-pack HTTP requests; clamped to 1..4096.
  # A single HTTP token may consume at most min(8, queue-capacity) pending requests.
  queue-capacity: 64
  # Durations and size/count limits below must be positive; most non-positive values are normalized to 1.
  idle-expire-minutes: 30
  build-timeout-seconds: 120
  # Total raw/canonical CAS plus Java artifact budget; minimum 2 MiB, divided evenly between both stores.
  disk-budget-mib: 20480
  disk-idle-days: 7
  max-archive-mib: 2048
  max-expanded-mib: 4096
  max-entry-mib: 512
  max-entries: 100000
  max-compression-ratio: 200
# If true, translates bedrock's showCoordinates game rule to java's reduced debug info flag
translate-show-coordinates-game-rule: false
# If true, disables the internal server blacklist. This will allow you to connect to any server, even if it's known to ban ViaBedrock clients
disable-server-blacklist: false
# The language code to send to the bedrock server (e.g. "en_us", "zh_cn"). Empty = "en_us"
language: ""
# NetEase / China Edition client emulation.
# enabled: pretend to be a NetEase client (RakNet 8 + protocol 860 + NetEase login fields).
# The MOT 1.21.124 NetEase compatibility path is a single protocol tuple.
# When enabled, ViaBedrock pins these values to protocol 860, GameVersion 1.21.124_NetEase and RakNet 8.
# The explicit values remain here so generated runtime configs document the required wire versions.
netease:
  enabled: false
  protocol-version: 860
  game-version: "1.21.124_NetEase"
  raknet-protocol-version: 8
# Shared secret for ViaProxy authentication bridge.
# When set, generates HMAC-signed identity tokens in the skin JWT.
# Must match the secret configured in the Nemisys ViaProxyAuth plugin.
# Empty still writes a Java-client marker so Waterdog skips fake-dimension transfers.
viaproxy-auth-secret: ""
# Enables server-side entity animation using Display Entities when ViaBedrockUtility mod is not present.
# When disabled, custom entities will only show as invisible interaction boxes (upstream behavior).
# This setting has no effect when ViaBedrockUtility mod is installed (client-side rendering is always used).
enable-server-entity-animation: true
# Timeout (ms) for fetching Java Edition skin from Mojang API during login.
# Set to 0 to disable Java skin fetching (always use Steve).
# The fetch runs asynchronously during the Bedrock server handshake, so actual blocking
# time is typically much shorter than this value.
java-skin-fetch-timeout: 1000

# Customizes the Java Edition tab list shown when joining a Bedrock server.
# Supported placeholders: %level_name%, %version%. Use an empty string to clear the header or footer.
# In quoted strings, use \n for line breaks and \u00A7 for Minecraft formatting codes.
tab-list:
  # If false, ViaBedrock will not send a custom tab list header or footer.
  enabled: true
  header: "%level_name%\n"
  footer: "\u00A7aViaBedrock \u00A73v%version%\n\u00A77https://github.com/RaphiMC/ViaBedrock"

# If true, applies Floyd-Steinberg dithering when converting Bedrock map pixels to the limited Java map color
# palette. This trades hard color banding for fine noise and greatly improves smooth gradients (faces/portraits).
# Set to false for crisp nearest-color output (better for flat-color / text / UI maps). Requires experimental features.
dither-maps: true

# BedrockLoader custom block mapping sync options.
# Requires enable-experimental-features: true; the experimental feature switch is the top-level gate.
customMappingSync:
  # If false, ViaBedrock will not request BedrockLoader mappings and will use vanilla-safe fallbacks.
  enabled: true
  # Maximum time to wait for a mapping snapshot.
  timeoutMs: 10000
  # Maximum uncompressed snapshot size accepted from BedrockLoader.
  maxSnapshotBytes: 16777216
  # Maximum custom payload size requested from BedrockLoader.
  maxPayloadBytes: 28672
  # Maximum number of custom block states accepted in a snapshot.
  maxCustomBlockStates: 65536
  # Maximum number of custom block entity types accepted in a snapshot.
  maxCustomBlockEntityTypes: 4096
  # Maximum Java block state id accepted for projected custom states.
  maxJavaBlockStateId: 1048575
  # Valid options: "SAFE_FALLBACK", "KICK"
  failureMode: "SAFE_FALLBACK"
  # Vanilla fallback used by local-degradation/profile building.
  defaultFallbackBlock: "minecraft:stone"
  # If false, chunked BedrockLoader mapping snapshots are rejected.
  enableChunks: true
  # If true, send BedrockLoader diagnostic result payloads.
  sendSyncResult: false

# Movement watchdog: a fail-safe net for the rare case where the backend never sends the packet that would
# unlock movement after a world/dimension/server switch, leaving the server-side player frozen while the
# client keeps moving. It NEVER touches the normal path - it only acts after a timeout far above any normal
# handshake, so normal players are unaffected.
movementWatchdog:
  # off     = disabled (behaviour identical to upstream)
  # observe = only log when a lock stays stuck past the timeout, without changing behaviour (default, safest)
  # active  = additionally perform the conservative, idempotent recovery (re-send the handshake finalization
  #           the backend omitted; for stuck chunks, re-request the chunk radius - never lets the player phase)
  mode: "observe"
  # Ticks (20/s) a dimension change may stay un-finalized before the watchdog acts. 200 = 10s.
  dimensionChangeTimeoutTicks: 200
  # Ticks the player may stay stuck in an unloaded chunk before the watchdog re-requests chunks. 200 = 10s.
  chunkStuckTimeoutTicks: 200
  # Throttle (ticks) between repeated chunk-radius re-requests while stuck. 100 = 5s.
  chunkRadiusRequestIntervalTicks: 100
