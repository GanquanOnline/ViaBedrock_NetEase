# 为 true 时启用实验性功能。这些功能几乎肯定未完全稳定/测试，可能导致意外问题
enable-experimental-features: false
# 为 true 时，Java 版剑在按住右键期间播放旧版格挡动画。
# 正常的剑右键交互仍会转发给基岩服务端。
# ViaBedrock 不会赋予伤害减免；只是抑制仅用于动画的释放数据包。
# 动画激活期间，Java 1.21.8 仍会应用其正常的持用减速。
# 需要 enable-experimental-features: true。
enable-sword-blocking-animation: false
# 双向桥接任意 Java 自定义负载与有大小上限的基岩 ScriptMessage。
java-custom-payload-bridge:
  enabled: false
  max-payload-bytes: 8192
  max-channel-bytes: 128
  max-messages-per-minute: 120
  max-bytes-per-minute: 262144
# 控制 blob 缓存（可减少网络流量和加载时间），可选值："disabled"、"memory"、"disk"
blob-cache: "disk"
# 启用后会启动资源包 HTTP 服务器并开启资源包转换
translate-resource-packs: true
# 资源包 HTTP 服务器地址
resource-pack-host: 127.0.0.1
# 资源包 HTTP 服务器端口（0 = 随机可用端口）
resource-pack-port: 0
# 客户端下载资源包时使用的 URL（留空 = 自动）
resource-pack-url: ""
# 资源包投递模式。"embedded" 由本 ViaProxy 进程提供资源包；
# "remote" 把转换后的资源包上传到共享资源包服务。
resource-pack-delivery:
  mode: embedded
  internal-url: ""
  public-url: ""
  shared-secret: ""
  connect-timeout-millis: 2000
  request-timeout-millis: 10000
# 控制资源包缓存（可减少网络流量和加载时间），可选值："disabled"、"memory"、"disk"
pack-cache: "disk"

# 进程级的内容寻址资源包缓存。把 enabled 设为 false 可改用旧的按连接路径。
# 该模式在进程启动时固定；修改 enabled 需要完全重启 ViaBedrock。
resource-pack-cache:
  enabled: true
# 为 true 时，仅当后端地址、UUID、原始版本、声明大小、content id、content-key 指纹，
# 以及完整有序的 RESOURCE_PACKS_INFO 声明全部相同时，才可复用此前校验过的 CDN 资源包。
# 内容冲突时一律重新获取；绝不只凭 UUID/版本号信任。
  trust-declared-pack-alias: false
# 0 = 自动（取 3072 MiB 与 max(512 MiB, 最大堆的四分之一) 中的较小值）。
  memory-budget-mib: 0
# 0 = 自动（取最大堆的一半与 memory-budget-mib 两倍中的较小值）。
  memory-hard-limit-mib: 0
# 0 = 自动（可用处理器数的一半，限制在 2..4）；配置值会被限制在 1..64。
  cpu-workers: 0
# 限制在 1..64。
  io-workers: 4
# 每个执行器以及所有待处理的资源包 HTTP 请求的上限；限制在 1..4096。
# 单个 HTTP 令牌最多可占用 min(8, queue-capacity) 个待处理请求。
  queue-capacity: 64
# 下面的时长与大小/数量限制必须为正数；多数非正值会被归一化为 1。
  idle-expire-minutes: 30
  build-timeout-seconds: 120
# 原始/规范化 CAS 加 Java 产物的总预算；最小 2 MiB，在两个存储之间均分。
  disk-budget-mib: 20480
  disk-idle-days: 7
  max-archive-mib: 2048
  max-expanded-mib: 4096
  max-entry-mib: 512
  max-entries: 100000
  max-compression-ratio: 200
# 为 true 时，把基岩的 showCoordinates 游戏规则转换为 Java 的 reduced debug info 标志
translate-show-coordinates-game-rule: false
# 为 true 时禁用内置服务器黑名单。这样即使某服务器已知会封禁 ViaBedrock 客户端，也允许连接
disable-server-blacklist: false
# 发送给基岩服务端的语言代码（例如 "en_us"、"zh_cn"）。留空 = "en_us"
language: ""
# 网易 / 中国版客户端仿真。
# enabled: 假装成网易客户端（网易登录字段 + RakNet 传输）。
# protocol-version 选择 Nukkit-MOT 配置：898 = 1.21.130_NetEase（modpc 3.10），
# 860 = 1.21.124_NetEase（modpc 3.9），0 = 自动（最新配置）。两者都保留可用。
# game-version 与 raknet-protocol-version 用于说明线上取值；启用时由所选配置决定
# （RakNet 8 与 11 均接受）。
netease:
  enabled: false
  protocol-version: 898
  game-version: "1.21.130_NetEase"
  raknet-protocol-version: 8
# ViaProxy 认证桥使用的共享密钥。
# 设置后会在皮肤 JWT 中生成 HMAC 签名的身份令牌。
# 必须与 Nemisys ViaProxyAuth 插件里配置的密钥一致。
# 留空时仍会写入 Java 客户端标记，使 Waterdog 跳过假维度传送。
viaproxy-auth-secret: ""
# 未安装 ViaBedrockUtility 模组时，启用基于 Display Entity 的服务端实体动画。
# 禁用后，自定义实体只会显示为不可见的交互框（上游行为）。
# 已安装 ViaBedrockUtility 模组时该设置无效（始终使用客户端渲染）。
enable-server-entity-animation: true
# 登录期间从 Mojang API 获取 Java 版皮肤的 超时（毫秒）。
# 设为 0 可禁用 Java 皮肤获取（始终使用 Steve）。
# 该获取在基岩服务端握手期间异步进行，因此实际阻塞时间
# 通常远小于该值。
java-skin-fetch-timeout: 1000

# 自定义加入基岩服务器时显示的 Java 版玩家列表。
# 支持的占位符：%level_name%、%version%。用空字符串清空页眉或页脚。
# 在引号字符串中，用 \n 表示换行，用 \u00A7 表示 Minecraft 格式代码。
tab-list:
  # 为 false 时，ViaBedrock 不发送自定义玩家列表页眉或页脚。
  enabled: true
  header: "%level_name%\n"
  footer: "\u00A7aViaBedrock \u00A73v%version%\n\u00A77https://github.com/RaphiMC/ViaBedrock"

# 为 true 时，在把基岩地图像素转换为 Java 有限的地图调色板时使用 Floyd-Steinberg 抖动。
# 这会用细噪声换掉生硬的色带，显著改善平滑渐变（人脸/头像）。
# 设为 false 则输出清晰的最近色（更适合纯色 / 文字 / UI 地图）。需要启用实验性功能。
dither-maps: true

# BedrockLoader 自定义方块映射同步选项。
# 需要 enable-experimental-features: true；实验性功能开关是总开关。
customMappingSync:
  # 为 false 时，ViaBedrock 不请求 BedrockLoader 映射，改用原版安全的回退方案。
  enabled: true
  # 等待映射快照的最长时间。
  timeoutMs: 10000
  # 接受的 BedrockLoader 未压缩快照最大大小。
  maxSnapshotBytes: 16777216
  # 向 BedrockLoader 请求的自定义负载最大大小。
  maxPayloadBytes: 28672
  # 快照中接受的自定义方块状态最大数量。
  maxCustomBlockStates: 65536
  # 快照中接受的自定义方块实体类型最大数量。
  maxCustomBlockEntityTypes: 4096
  # 投影自定义状态时接受的 Java 方块状态 ID 上限。
  maxJavaBlockStateId: 1048575
  # 可选值："SAFE_FALLBACK"、"KICK"
  failureMode: "SAFE_FALLBACK"
  # 本地降级/构建配置时使用的原版回退方块。
  defaultFallbackBlock: "minecraft:stone"
  # 为 false 时，拒绝分块的 BedrockLoader 映射快照。
  enableChunks: true
  # 为 true 时发送 BedrockLoader 诊断结果负载。
  sendSyncResult: false

# 移动看门狗：一种兜底机制，用于世界/维度/服务器切换后后端始终没有发送会
# 解锁移动的数据包这种少见情况，此时服务端玩家会卡住而客户端仍在移动。
# 它绝不介入正常路径——只有在超过远高于正常握手的超时之后才会动作，
# 因此正常玩家不受影响。
movementWatchdog:
  # off     = 禁用（行为与上游完全一致）
  # observe = 仅在锁定超过超时仍卡住时记录日志，不改变行为（默认，最安全）
  # active  = 额外执行保守且幂等的恢复（重发后端遗漏的握手收尾；
  #           对卡住的区块重新请求区块半径——绝不让玩家穿模）
  mode: "observe"
  # 维度切换可以保持未最终化的刻数（20 刻/秒），超过后看门狗才动作。200 = 10 秒。
  dimensionChangeTimeoutTicks: 200
  # 玩家可以卡在未加载区块中的刻数，超过后看门狗重新请求区块。200 = 10 秒。
  chunkStuckTimeoutTicks: 200
  # 卡住期间重复请求区块半径的最小间隔（刻）。100 = 5 秒。
  chunkRadiusRequestIntervalTicks: 100
